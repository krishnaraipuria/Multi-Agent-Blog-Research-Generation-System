[project]
name = "blogagent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Krishna Raipuria", email = "krishna.raipuria2006@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.3.18",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.1",
    "langchain-google-genai>=4.3.7",
    "langchain-groq>=1.1.3",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.11",
    "langsmith>=0.11.2",
    "mcp>=1.29.1",
    "python-dotenv>=1.2.3",
    "sentence-transformers>=6.0.0",
]

[project.scripts]
blogagent = "blogagent:main"

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"
